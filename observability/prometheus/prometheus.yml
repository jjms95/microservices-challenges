global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'employees-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['employees-service:8080']

  - job_name: 'departments-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['departments-service:8081']

  - job_name: 'profiles-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['profiles-service:8083']

  - job_name: 'notifications-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notifications-service:8084']

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8085']
