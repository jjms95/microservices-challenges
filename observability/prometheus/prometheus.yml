# DOC: Configuración inicial de Prometheus para el Reto 7 (Observabilidad)
# Este archivo define los intervalos de raspado y los objetivos (microservicios) a monitorear.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# FIX: Se configuran los jobs de scraping para cada microservicio del ecosistema.
# Se utilizan los nombres de servicio de Docker Compose como hostnames.
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'employees-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['employees-service:8080']

  - job_name: 'departments-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['departments-service:8081']

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth-service:8085']

  - job_name: 'notifications-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notifications-service:8084']

  - job_name: 'profiles-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['profiles-service:8083']
