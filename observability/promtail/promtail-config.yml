# DOC: Configuración de Promtail para recolectar logs de contenedores Docker (Reto 7)
# Envía los logs recolectados a Loki para su agregación y consulta en Grafana.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# FIX: Configuración para descubrir automáticamente los contenedores Docker y extraer logs.
# Requiere que el socket de Docker (/var/run/docker.sock) esté montado en el contenedor.
scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
