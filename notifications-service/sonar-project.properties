sonar.projectKey=notifications-service
sonar.projectName=Notifications Service
sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/*_test.py,**/test_*.py
# FIX: Se eliminó la línea "sonar.exclusions=**/test_*.py,**/*_test.py" que existía
# anteriormente. Esa exclusión contradecía sonar.test.inclusions al excluir los mismos
# archivos de test que se intentaban incluir, provocando que SonarQube los ignorara
# por completo y el Quality Gate fallara en el pipeline de Jenkins.
sonar.python.coverage.reportPaths=coverage.xml
